[project]
name = "entropy"
version = "0.1.0"
description = "Entropy: a Qt Quick image upscaler powered by MNN, OpenCL and Vulkan"
readme = "README.md"
authors = [
    { name = "jedace07", email = "jedacev07@gmail.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "Pillow>=11,<13",
    "platformdirs>=4.3,<5",
    "pydantic>=2.10,<3",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
mnn = ["MNN>=3.6.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11"]

[project.scripts]
entropy = "src:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

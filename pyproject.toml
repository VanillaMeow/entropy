[project]
name = "entropy"
version = "0.1.0a1"
description = "Entropy: a Qt Quick image upscaler powered by MNN, OpenCL and Vulkan"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "jedace07", email = "jedacev07@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5.4,<3",
    "Pillow>=13.0.0,<14",
    "platformdirs>=4.14.5,<5",
    "pydantic>=2.14.3,<3",
    "PySide6>=6.12.0,<7",
]

[project.optional-dependencies]
mnn = ["MNN>=3.6.2,<4"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "ruff>=0.17.4"]

[project.scripts]
entropy = "src:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

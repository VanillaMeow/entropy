name: Publish builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.jedace07.Entropy.yaml
          bundle: entropy-x86_64.flatpak
          arch: x86_64
          build-dir: flatpak-build
          repo-dir: flatpak-repo
          artifact-name: flatpak-x86_64

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Set up MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - run: uv sync --locked

      - name: Build OpenCL and Vulkan runtime
        run: uv run python scripts/build_mnn.py --jobs 2

      - name: Package and smoke-test portable Windows build
        run: uv run python scripts/package_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/entropy-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [flatpak, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/entropy-x86_64.flatpak
            release/entropy-windows-x86_64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

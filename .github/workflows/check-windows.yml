name: Check published Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        required: true
        default: v0.2.1-alpha.1
      repair_worker_path:
        description: Verify the missing worker executable diagnosis
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installed:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Download published installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$env:RELEASE_TAG" --pattern entropy-windows-x86_64-setup.exe --dir dist

      - name: Check installed worker and maintenance tool
        env:
          ENTROPY_TEST_REPAIR_WORKER: ${{ inputs.repair_worker_path }}
        run: uv run --no-project --with PySide6==6.12.0 python scripts/check_windows_install.py dist/entropy-windows-x86_64-setup.exe
